[build]
  command = "npm run build"
  publish = "dist"

# Built with a base path of /admin (see sanity.cli.ts), so the HTML asks for
# /admin/static/* — but the files are published at the root of this site, the
# same trap the chat site hits with /_astro. These must come before the SPA
# fallback below: Netlify applies the first matching rule.
[[redirects]]
  from = "/admin/static/*"
  to = "/static/:splat"
  status = 200

# The Studio is a single-page app: every other path must serve index.html so a
# deep link to a document survives a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
